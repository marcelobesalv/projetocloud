include classpath("application.conf")

# URL das filas devolvida aos clientes (host = nome do serviço no docker-compose)
node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

# Painel com contagem de mensagens: http://localhost:9325
rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

aws {
  region = us-east-2
  accountId = 000000000000
}

queues {
  orders-dlq {
    defaultVisibilityTimeout = 30 seconds
  }
  orders {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "orders-dlq"
      maxReceiveCount = 5
    }
  }
}
